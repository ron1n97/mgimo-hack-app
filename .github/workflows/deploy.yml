name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/worker:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & push bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bot/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/bot:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/bot:latest
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Bootstrap host (docker + swap)
        run: |
          scp -o IdentitiesOnly=yes scripts/server-bootstrap.sh \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/server-bootstrap.sh"
          ssh -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash /tmp/server-bootstrap.sh'

      - name: Upload compose + env
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          ssh -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'mkdir -p /opt/mgimo-hack-app'
          scp -o IdentitiesOnly=yes docker-compose.prod.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/mgimo-hack-app/docker-compose.yml"
          umask 077
          printf '%s\n' "$PROD_ENV" > /tmp/dekanat.prod.env
          scp -o IdentitiesOnly=yes /tmp/dekanat.prod.env \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/mgimo-hack-app/.env"
          ssh -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'chmod 600 /opt/mgimo-hack-app/.env'
          rm -f /tmp/dekanat.prod.env

      - name: Pull & up
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -euo pipefail
             echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
             cd /opt/mgimo-hack-app
             export IMAGE_PREFIX='${{ env.IMAGE_PREFIX }}'
             export IMAGE_TAG='$IMAGE_TAG'
             # merge image vars into runtime without wiping secrets
             grep -q '^IMAGE_PREFIX=' .env && sed -i \"s|^IMAGE_PREFIX=.*|IMAGE_PREFIX=$IMAGE_PREFIX|\" .env || echo IMAGE_PREFIX=$IMAGE_PREFIX >> .env
             grep -q '^IMAGE_TAG=' .env && sed -i \"s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|\" .env || echo IMAGE_TAG=$IMAGE_TAG >> .env
             docker compose pull
             docker compose up -d --remove-orphans
             docker compose ps
             docker compose exec -T api node -e \"console.log('api-boot-check')\" || true
            "
