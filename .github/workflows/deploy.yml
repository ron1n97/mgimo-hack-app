name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/worker:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & push bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bot/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/bot:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/bot:latest
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Login GHCR (runner)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images on runner
        env:
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          for s in api worker web bot; do
            docker pull "${IMAGE_PREFIX}/$s:$TAG"
            docker tag "${IMAGE_PREFIX}/$s:$TAG" "${IMAGE_PREFIX}/$s:latest"
          done

      - name: Bootstrap host
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            scripts/server-bootstrap.sh \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/server-bootstrap.sh"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash /tmp/server-bootstrap.sh'

      - name: Upload compose + Caddyfile + env
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          HOST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "$HOST" \
            'mkdir -p /opt/mgimo-hack-app'
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            docker-compose.prod.yml "$HOST:/opt/mgimo-hack-app/docker-compose.yml"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            Caddyfile "$HOST:/opt/mgimo-hack-app/Caddyfile"
          umask 077
          {
            printf '%s\n' "$PROD_ENV"
            echo "IMAGE_PREFIX=${IMAGE_PREFIX}"
            echo "IMAGE_TAG=${TAG}"
          } > /tmp/dekanat.prod.env
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            /tmp/dekanat.prod.env "$HOST:/opt/mgimo-hack-app/.env"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "$HOST" \
            'chmod 600 /opt/mgimo-hack-app/.env'
          rm -f /tmp/dekanat.prod.env

      - name: Stream images to host (no GHCR pull on VPS)
        env:
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          HOST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          docker save \
            "${IMAGE_PREFIX}/api:${TAG}" \
            "${IMAGE_PREFIX}/worker:${TAG}" \
            "${IMAGE_PREFIX}/web:${TAG}" \
            "${IMAGE_PREFIX}/bot:${TAG}" \
            "${IMAGE_PREFIX}/api:latest" \
            "${IMAGE_PREFIX}/worker:latest" \
            "${IMAGE_PREFIX}/web:latest" \
            "${IMAGE_PREFIX}/bot:latest" \
          | gzip -1 \
          | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "$HOST" \
              'gunzip | docker load'

      - name: Compose up
        run: |
          HOST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "$HOST" \
            'cd /opt/mgimo-hack-app && docker compose up -d --remove-orphans && docker compose ps'
